<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>裏千家 お点前一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eae6da;
  --paper-deep:#e1dccb;
  --ink:#2b2b26;
  --ink-soft:#6b6558;
  --line:#c9c2ac;
  --furo:#5b7052;      /* 風炉=夏 若葉色 */
  --furo-bg:#e4eadd;
  --ro:#8a3d24;         /* 炉=冬 熾火色 */
  --ro-bg:#ecdcd2;
  --accent:#9a1f2b;     /* 印 朱 */
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#211f1a; --paper-deep:#191712; --ink:#e8e3d6; --ink-soft:#a39c89;
    --line:#48423a; --furo-bg:#26301f; --ro-bg:#32211a;
  }
}
:root[data-theme="dark"]{
  --paper:#211f1a; --paper-deep:#191712; --ink:#e8e3d6; --ink-soft:#a39c89;
  --line:#48423a; --furo-bg:#26301f; --ro-bg:#32211a;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Zen Kaku Gothic New",sans-serif;
  -webkit-font-smoothing:antialiased;
}
header{
  padding:2.2rem 1.4rem 1.4rem; text-align:center;
  border-bottom:1px solid var(--line);
  background:var(--paper-deep);
}
header h1{
  font-family:"Shippori Mincho",serif; font-weight:700;
  font-size:clamp(1.5rem,5vw,2.1rem); letter-spacing:.08em; margin:0 0 .3rem;
}
header p{margin:0; color:var(--ink-soft); font-size:.85rem; letter-spacing:.05em;}

.controls{
  max-width:760px; margin:0 auto; padding:1rem 1.2rem 0;
}
.search-row{display:flex; gap:.5rem; margin-bottom:.8rem;}
.search-row input{
  flex:1; padding:.6rem .8rem; border:1px solid var(--line); border-radius:2px;
  background:var(--paper); color:var(--ink); font-family:inherit; font-size:.95rem;
}
.search-row input:focus{outline:2px solid var(--accent); outline-offset:1px;}

.season-toggle{display:flex; gap:.5rem; margin-bottom:.9rem;}
.season-toggle button{
  flex:1; padding:.5rem .6rem; border:1px solid var(--line); background:var(--paper);
  color:var(--ink-soft); font-family:"Shippori Mincho",serif; font-size:.9rem;
  cursor:pointer; border-radius:2px; letter-spacing:.05em;
}
.season-toggle button[aria-pressed="true"].furo{background:var(--furo-bg); color:var(--furo); border-color:var(--furo);}
.season-toggle button[aria-pressed="true"].ro{background:var(--ro-bg); color:var(--ro); border-color:var(--ro);}

.cats{display:flex; flex-wrap:wrap; gap:.4rem; margin-bottom:1.2rem;}
.cats button{
  padding:.35rem .7rem; border:1px solid var(--line); background:transparent;
  color:var(--ink-soft); font-size:.78rem; border-radius:20px; cursor:pointer;
}
.cats button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink);}

main{max-width:760px; margin:0 auto; padding:0 1.2rem 3rem;}
.group{margin-top:1.6rem;}
.group h2{
  font-family:"Shippori Mincho",serif; font-size:1rem; font-weight:700;
  margin:0 0 .2rem; padding-bottom:.35rem; border-bottom:2px solid var(--ink);
  display:flex; align-items:baseline; gap:.5rem;
}
.group h2 span{font-size:.72rem; font-weight:400; color:var(--ink-soft); font-family:"Zen Kaku Gothic New",sans-serif;}

.item{
  display:flex; gap:.9rem; padding:.85rem 0; border-bottom:1px solid var(--line);
  align-items:flex-start;
}
.item.has-proc{flex-direction:column; align-items:stretch; gap:0;}
.item-top{display:flex; gap:.9rem; align-items:flex-start;}
.item .name{
  font-family:"Shippori Mincho",serif; font-weight:700; font-size:1rem;
  min-width:7.4em; flex-shrink:0;
}
.item .name small{display:block; font-family:"Zen Kaku Gothic New",sans-serif; font-weight:400; font-size:.68rem; color:var(--ink-soft);}
.item .desc{flex:1; font-size:.85rem; line-height:1.6; color:var(--ink-soft);}
.badges{display:flex; gap:.3rem; flex-shrink:0; align-items:center; padding-top:.15rem;}
.badge{
  width:1.9em; height:1.9em; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:.62rem; border:1px solid var(--line); color:var(--line);
}
.badge.on.furo{background:var(--furo-bg); color:var(--furo); border-color:var(--furo);}
.badge.on.ro{background:var(--ro-bg); color:var(--ro); border-color:var(--ro);}

.name.expandable{cursor:pointer; display:inline-flex; align-items:baseline; gap:.35em;}
.expand-arrow{font-size:.7rem; color:var(--ink-soft); transition:transform .2s; display:inline-block;}
.name.expandable.open .expand-arrow{transform:rotate(90deg);}
.expand-box{margin-top:.8rem;}
.ref-link-wrap{margin:.6rem .9rem 0; padding-top:.6rem; border-top:1px solid var(--line);}
.ref-link{
  display:inline-block; font-size:.78rem; color:var(--accent); text-decoration:none;
  border-bottom:1px solid var(--accent); padding-bottom:.1em;
}
.ref-link:active{opacity:.7;}

.item.kihon{flex-direction:column; align-items:stretch;}
.item.kihon .name{min-width:0;}
.kihon-head{display:flex; flex-direction:column; align-items:flex-start; gap:.5rem;}
.name-en{display:block; font-family:"Zen Kaku Gothic New",sans-serif; font-weight:400; font-size:.72rem; color:var(--ink-soft); font-style:italic; margin-top:.1em;}
.desc-en{font-size:.8rem; color:var(--ink-soft); font-style:italic; margin-top:.25em;}
.btn-group{display:flex; gap:.4rem; flex-wrap:wrap; justify-content:flex-start;}
.speak-btn{
  flex-shrink:0; padding:.35rem .75rem; border:1px solid var(--line); background:var(--paper);
  color:var(--ink-soft); font-size:.72rem; border-radius:20px; cursor:pointer;
  font-family:"Zen Kaku Gothic New",sans-serif; white-space:nowrap;
}
.speak-btn:active{opacity:.8;}
.speak-btn.speaking{background:var(--accent); color:#fff; border-color:var(--accent);}
.steps-box{
  margin-top:.7rem; border-radius:4px;
  background:var(--paper-deep); border:1px solid var(--line);
}
.steps-box ol{margin:0; padding:.8rem .9rem .8rem 1.9em; font-size:.82rem; line-height:1.7; color:var(--ink);}
.steps-box li{margin-bottom:.35em; transition:color .2s;}
.steps-box li:last-child{margin-bottom:0;}
.steps-box li.reading{color:var(--accent); font-weight:700;}
.step-en{display:block; font-size:.76rem; color:var(--ink-soft); font-style:italic; margin-top:.15em;}
.steps-box li.reading .step-en{color:var(--accent);}

.empty{text-align:center; color:var(--ink-soft); padding:3rem 1rem; font-size:.9rem;}
footer{text-align:center; padding:1.5rem; color:var(--ink-soft); font-size:.72rem;}
</style>
</head>
<body>
<header>
  <h1>裏千家 お点前一覧</h1>
  <p>季節・分類で絞り込み、稽古の振り返りに</p>
</header>

<div class="controls">
  <div class="search-row"><input id="q" type="text" placeholder="点前名で検索（例：貴人点、花月）"></div>
  <div class="season-toggle">
    <button class="furo" id="btnFuro" aria-pressed="false">風炉　5〜10月</button>
    <button class="ro" id="btnRo" aria-pressed="false">炉　11〜4月</button>
  </div>
  <div class="cats" id="cats"></div>
</div>

<main id="main"></main>

let voicesCache = [];
function loadVoices(){
  voicesCache = window.speechSynthesis.getVoices();
}
if('speechSynthesis' in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

const PREFERRED_VOICE_NAMES = [
  'Google US English', 'Samantha', 'Alex', 'Ava', 'Natural',
  'Microsoft Aria', 'Microsoft Jenny', 'Microsoft Guy',
  'Google UK English Female', 'Google UK English Male'
];

function pickVoice(lang){
  if(!voicesCache.length) voicesCache = window.speechSynthesis.getVoices();
  const prefix = lang.split('-')[0].toLowerCase();
  const candidates = voicesCache.filter(v => v.lang && v.lang.toLowerCase().startsWith(prefix));
  if(!candidates.length) return null;
  const exact = candidates.filter(v => v.lang.toLowerCase() === lang.toLowerCase());
  const pool = exact.length ? exact : candidates;
  for(const wanted of PREFERRED_VOICE_NAMES){
    const match = pool.find(v => v.name.includes(wanted));
    if(match) return match;
  }
  const local = pool.find(v => v.localService);
  return local || pool[0];
}

let currentBtn = null;

function clearHighlight(){
  document.querySelectorAll('.steps-box li.reading').forEach(li => li.classList.remove('reading'));
}

function stopSpeaking(){
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  if(currentBtn){
    currentBtn.textContent = currentBtn.dataset.label || '▶ 読み上げ';
    currentBtn.classList.remove('speaking');
  }
  clearHighlight();
  currentBtn = null;
}

const READING_FIXES = [
  ['開け閉め', 'あけしめ'],
  ['縁を持って', 'ふちをもって'],
  ['開ける', 'あける']
];

function toSpeechText(text){
  let out = text;
  READING_FIXES.forEach(([from, to]) => {
    out = out.split(from).join(to);
  });
  return out;
}

function speakKihon(queueTexts, lang, liEls, btn){
  if(!('speechSynthesis' in window)){
    alert('お使いの環境は読み上げに対応していません');
    return;
  }
  const wasThis = (currentBtn === btn);
  stopSpeaking();
  if(wasThis) return;

  let i = 0;
  btn.textContent = lang.startsWith('ja') ? '■ 停止' : '■ Stop';
  btn.classList.add('speaking');
  currentBtn = btn;

  function speakNext(){
    clearHighlight();
    if(i >= queueTexts.length){
      stopSpeaking();
      return;
    }
    if(i >= 1 && liEls[i-1]){
      liEls[i-1].classList.add('reading');
      liEls[i-1].scrollIntoView({block:'nearest', behavior:'smooth'});
    }
    const text = lang.startsWith('ja') ? toSpeechText(queueTexts[i]) : queueTexts[i];
    const utter = new SpeechSynthesisUtterance(text);
    const voice = pickVoice(lang);
    if(voice){
      utter.voice = voice;
      utter.lang = voice.lang;
    } else {
      utter.lang = lang;
    }
    utter.rate = 0.95;
    utter.onend = () => { i++; speakNext(); };
    utter.onerror = () => { stopSpeaking(); };
    window.speechSynthesis.speak(utter);
  }
  speakNext();
}

            <span class="badge ${f?'on furo':''}" title="風炉・薄茶">風薄</span>
            <span class="badge ${F?'on furo':''}" title="風炉・濃茶">風濃</span>
            <span class="badge ${r?'on ro':''}" title="炉・薄茶">炉薄</span>
            <span class="badge ${R?'on ro':''}" title="炉・濃茶">炉濃</span>`;

        itemTop.appendChild(nameDiv);
        itemTop.appendChild(descDiv);
        itemTop.appendChild(badgesDiv);
        row.appendChild(itemTop);

        if(proc){
          row.classList.add('has-proc');
          nameDiv.classList.add('expandable');
          nameDiv.innerHTML += '<span class="expand-arrow">▸</span>';

          const expandBox = document.createElement('div');
          expandBox.className = 'steps-box expand-box';
          expandBox.hidden = true;
          const ol = document.createElement('ol');
          proc.forEach(s => {
            const li = document.createElement('li');
            li.textContent = s;
            ol.appendChild(li);
          });
          expandBox.appendChild(ol);

          if(procUrl){
            const refP = document.createElement('p');
            refP.className = 'ref-link-wrap';
            const refA = document.createElement('a');
            refA.href = procUrl;
            refA.target = '_blank';
            refA.rel = 'noopener noreferrer';
            refA.className = 'ref-link';
            refA.textContent = '参考ページを見る ↗';
            refP.appendChild(refA);
            expandBox.appendChild(refP);
          }

          nameDiv.onclick = () => {
            const open = !expandBox.hidden;
            expandBox.hidden = open;
            nameDiv.classList.toggle('open', !open);
          };
          row.appendChild(expandBox);
        }
      }
      g.appendChild(row);
    });
    mainEl.appendChild(g);
  });

  if(!shown){
    mainEl.innerHTML = '<div class="empty">該当するお点前が見つかりませんでした</div>';
  }
}
render();
</script>
</body>
</html>
