<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>裏千家 お点前一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eae6da;
  --paper-deep:#e1dccb;
  --ink:#2b2b26;
  --ink-soft:#6b6558;
  --line:#c9c2ac;
  --furo:#5b7052;      /* 風炉=夏 若葉色 */
  --furo-bg:#e4eadd;
  --ro:#8a3d24;         /* 炉=冬 熾火色 */
  --ro-bg:#ecdcd2;
  --accent:#9a1f2b;     /* 印 朱 */
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#211f1a; --paper-deep:#191712; --ink:#e8e3d6; --ink-soft:#a39c89;
    --line:#48423a; --furo-bg:#26301f; --ro-bg:#32211a;
  }
}
:root[data-theme="dark"]{
  --paper:#211f1a; --paper-deep:#191712; --ink:#e8e3d6; --ink-soft:#a39c89;
  --line:#48423a; --furo-bg:#26301f; --ro-bg:#32211a;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Zen Kaku Gothic New",sans-serif;
  -webkit-font-smoothing:antialiased;
}
header{
  padding:2.2rem 1.4rem 1.4rem; text-align:center;
  border-bottom:1px solid var(--line);
  background:var(--paper-deep);
}
header h1{
  font-family:"Shippori Mincho",serif; font-weight:700;
  font-size:clamp(1.5rem,5vw,2.1rem); letter-spacing:.08em; margin:0 0 .3rem;
}
header p{margin:0; color:var(--ink-soft); font-size:.85rem; letter-spacing:.05em;}

.controls{
  max-width:760px; margin:0 auto; padding:1rem 1.2rem 0;
}
.search-row{display:flex; gap:.5rem; margin-bottom:.8rem;}
.search-row input{
  flex:1; padding:.6rem .8rem; border:1px solid var(--line); border-radius:2px;
  background:var(--paper); color:var(--ink); font-family:inherit; font-size:.95rem;
}
.search-row input:focus{outline:2px solid var(--accent); outline-offset:1px;}

.season-toggle{display:flex; gap:.5rem; margin-bottom:.9rem;}
.season-toggle button{
  flex:1; padding:.5rem .6rem; border:1px solid var(--line); background:var(--paper);
  color:var(--ink-soft); font-family:"Shippori Mincho",serif; font-size:.9rem;
  cursor:pointer; border-radius:2px; letter-spacing:.05em;
}
.season-toggle button[aria-pressed="true"].furo{background:var(--furo-bg); color:var(--furo); border-color:var(--furo);}
.season-toggle button[aria-pressed="true"].ro{background:var(--ro-bg); color:var(--ro); border-color:var(--ro);}

.cats{display:flex; flex-wrap:wrap; gap:.4rem; margin-bottom:1.2rem;}
.cats button{
  padding:.35rem .7rem; border:1px solid var(--line); background:transparent;
  color:var(--ink-soft); font-size:.78rem; border-radius:20px; cursor:pointer;
}
.cats button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink);}

main{max-width:760px; margin:0 auto; padding:0 1.2rem 3rem;}
.group{margin-top:1.6rem;}
.group h2{
  font-family:"Shippori Mincho",serif; font-size:1rem; font-weight:700;
  margin:0 0 .2rem; padding-bottom:.35rem; border-bottom:2px solid var(--ink);
  display:flex; align-items:baseline; gap:.5rem;
}
.group h2 span{font-size:.72rem; font-weight:400; color:var(--ink-soft); font-family:"Zen Kaku Gothic New",sans-serif;}

.item{
  display:flex; gap:.9rem; padding:.85rem 0; border-bottom:1px solid var(--line);
  align-items:flex-start;
}
.item .name{
  font-family:"Shippori Mincho",serif; font-weight:700; font-size:1rem;
  min-width:7.4em; flex-shrink:0;
}
.item .name small{display:block; font-family:"Zen Kaku Gothic New",sans-serif; font-weight:400; font-size:.68rem; color:var(--ink-soft);}
.item .desc{flex:1; font-size:.85rem; line-height:1.6; color:var(--ink-soft);}
.badges{display:flex; gap:.3rem; flex-shrink:0; align-items:center; padding-top:.15rem;}
.badge{
  width:1.9em; height:1.9em; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:.62rem; border:1px solid var(--line); color:var(--line);
}
.badge.on.furo{background:var(--furo-bg); color:var(--furo); border-color:var(--furo);}
.badge.on.ro{background:var(--ro-bg); color:var(--ro); border-color:var(--ro);}

.item.kihon{flex-direction:column; align-items:stretch;}
.item.kihon .name{min-width:0;}
.steps-box{
  margin-top:.7rem; border-radius:4px;
  background:var(--paper-deep); border:1px solid var(--line);
}
.steps-box ol{margin:0; padding:.8rem .9rem .8rem 1.9em; font-size:.82rem; line-height:1.7; color:var(--ink);}
.steps-box li{margin-bottom:.35em;}
.steps-box li:last-child{margin-bottom:0;}

.empty{text-align:center; color:var(--ink-soft); padding:3rem 1rem; font-size:.9rem;}
footer{text-align:center; padding:1.5rem; color:var(--ink-soft); font-size:.72rem;}
</style>
</head>
<body>
<header>
  <h1>裏千家 お点前一覧</h1>
  <p>季節・分類で絞り込み、稽古の振り返りに</p>
</header>

<div class="controls">
  <div class="search-row"><input id="q" type="text" placeholder="点前名で検索（例：貴人点、花月）"></div>
  <div class="season-toggle">
    <button class="furo" id="btnFuro" aria-pressed="false">風炉　5〜10月</button>
    <button class="ro" id="btnRo" aria-pressed="false">炉　11〜4月</button>
  </div>
  <div class="cats" id="cats"></div>
</div>

const catsEl = document.getElementById('cats');
const mainEl = document.getElementById('main');
const qEl = document.getElementById('q');
const btnFuro = document.getElementById('btnFuro');
const btnRo = document.getElementById('btnRo');

let activeCat = 'all';
let seasonFuro = false, seasonRo = false;

DATA.forEach(([cat]) => {
  const b = document.createElement('button');
  b.textContent = cat;
  b.setAttribute('aria-pressed','false');
  b.onclick = () => { activeCat = (activeCat===cat)?'all':cat; render(); };
  catsEl.appendChild(b);
});

function toggleSeason(which){
  if(which==='furo'){ seasonFuro = !seasonFuro; }
  else { seasonRo = !seasonRo; }
  btnFuro.setAttribute('aria-pressed', seasonFuro);
  btnRo.setAttribute('aria-pressed', seasonRo);
  render();
}
btnFuro.onclick = () => toggleSeason('furo');
btnRo.onclick = () => toggleSeason('ro');
qEl.addEventListener('input', render);

function render(){
  [...catsEl.children].forEach(b => b.setAttribute('aria-pressed', b.textContent===activeCat));
  const query = qEl.value.trim();
  mainEl.innerHTML = '';
  let shown = 0;

  DATA.forEach(([cat, catKana, catNote, items]) => {
    if(activeCat!=='all' && activeCat!==cat) return;
    const filtered = items.filter(([name,kana,desc,f,F,r,R,steps]) => {
      if(seasonFuro && !(f||F)) return false;
      if(seasonRo && !(r||R)) return false;
      if(query && !(name.includes(query) || kana.includes(query) || desc.includes(query))) return false;
      return true;
    });
    if(!filtered.length) return;
    shown += filtered.length;

    const g = document.createElement('div');
    g.className = 'group';
    g.innerHTML = `<h2>${cat}${catNote?`<span>${catNote}</span>`:''}</h2>`;
    filtered.forEach(([name,kana,desc,f,F,r,R,steps]) => {
      const row = document.createElement('div');
      if(steps){
        row.className = 'item kihon';
        const stepsHtml = steps.map(s => `<li>${s}</li>`).join('');
        row.innerHTML = `
          <div class="name">${name}${kana?`<small>${kana}</small>`:''}</div>
          <div class="desc">${desc}</div>
          <div class="steps-box"><ol>${stepsHtml}</ol></div>`;
      } else {
        row.className = 'item';
        row.innerHTML = `
          <div class="name">${name}${kana?`<small>${kana}</small>`:''}</div>
          <div class="desc">${desc}</div>
          <div class="badges">
            <span class="badge ${f?'on furo':''}" title="風炉・薄茶">風薄</span>
            <span class="badge ${F?'on furo':''}" title="風炉・濃茶">風濃</span>
            <span class="badge ${r?'on ro':''}" title="炉・薄茶">炉薄</span>
            <span class="badge ${R?'on ro':''}" title="炉・濃茶">炉濃</span>
          </div>`;
      }
      g.appendChild(row);
    });
    mainEl.appendChild(g);
  });

  if(!shown){
    mainEl.innerHTML = '<div class="empty">該当するお点前が見つかりませんでした</div>';
  }
}
render();
</script>
</body>
</html>
